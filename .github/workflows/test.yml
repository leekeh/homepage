name: Test

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # vitest --changed / playwright --only-changed diff against this ref.
  # On a PR: the target branch. On a push to main: the previous commit.
  BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

jobs:
  # Static quality gate: formatting + lint + type-check. Fast, no browsers.
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prettier --check + eslint
      - run: pnpm run lint

      # svelte-kit sync + svelte-check (tsgo)
      - run: pnpm run check

  # Fast, affected-only unit + isolated-widget tests.
  # vitest uses Vite's module graph, so only tests whose dependencies changed run.
  unit:
    name: Unit & widget tests (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so --changed can diff against the base ref.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browser-mode widget tests run in real Chromium.
      - run: pnpm exec playwright install chromium --with-deps

      - name: Fetch base ref
        if: github.base_ref != ''
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Run affected unit + widget tests
        run: pnpm exec vitest run --changed ${{ env.BASE_REF }}

  # Global OS end-to-end tests: desktop + mobile + no-js. Always run all three.
  e2e:
    name: E2E OS tests (desktop / mobile / no-js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      # Includes the axe-core a11y sweep (axe.desktop / axe.mobile specs).
      # The `og` project is affected-scoped in its own job, so exclude it here.
      - name: Run Playwright OS tests
        run: pnpm exec playwright test --project=desktop --project=mobile --project=no-js

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Every URL must ship a resolvable og:image. Affected-only: the sweep imports
  # the route/treats data, so --only-changed re-runs it whenever those change.
  og-image:
    name: OG image sweep (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so --only-changed can diff against the base ref.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      - name: Fetch base ref
        if: github.base_ref != ''
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      # webServer (build + preview) is started automatically by the config.
      - name: Run affected OG image sweep
        run: pnpm exec playwright test --project=og --only-changed=${{ env.BASE_REF }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: og-report
          path: playwright-report/
          retention-days: 7

  # Validate the prerendered HTML output against html-validate:recommended.
  # (Blog posts are SSR-only, not prerendered, so they're covered by the axe
  # sweep instead of here.)
  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run test:html

  # Lighthouse over all widget / treat / blog routes. Performance is warn-only
  # (runner CPU/network noise makes it flaky); accessibility, best-practices and
  # SEO are blocking. Never a required check for perf regressions alone.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Start preview server
        run: |
          pnpm run preview --port 4173 &
          npx --yes wait-on http://localhost:4173 --timeout 60000

      - name: Generate route list
        run: node scripts/qa-routes.mjs http://localhost:4173 > lighthouse-urls.json

      - name: Run Lighthouse CI
        run: pnpm run test:lighthouse

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
